<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poker Equity Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#231a15;
    --felt:#2fa36b;
    --felt-dark:#1e7a4e;
    --rail:#8b4a2b;
    --rail-dark:#5e2f19;
    --cream:#fdf6e8;
    --gold:#ffc93c;
    --red:#e03b3b;
    --shadow:4px 4px 0 rgba(35,26,21,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
    font-weight:600;
    background:radial-gradient(circle at 20% 10%, #ffe9bf 0%, #f0cf92 55%, #d9b071 100%);
    color:var(--ink);
    min-height:100vh;
    padding:24px 16px 48px;
  }
  header{text-align:center;margin-bottom:18px}
  h1{font-size:34px;font-weight:800;letter-spacing:.5px;
     text-shadow:2px 2px 0 var(--cream), 4px 4px 0 rgba(35,26,21,.25)}
  .sub{font-size:15px;opacity:.75;margin-top:2px}

  /* ---------- toolbar ---------- */
  .toolbar{
    display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;
    margin:0 auto 20px;max-width:1060px;
  }
  .group{
    display:flex;align-items:center;gap:8px;
    background:var(--cream);border:3px solid var(--ink);border-radius:14px;
    padding:6px 12px;box-shadow:var(--shadow);
  }
  .group label{font-size:14px;text-transform:uppercase;letter-spacing:.6px;opacity:.7}
  button{
    font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;
    background:var(--cream);color:var(--ink);
    border:3px solid var(--ink);border-radius:12px;
    padding:7px 14px;box-shadow:var(--shadow);
    transition:transform .06s ease, box-shadow .06s ease;
  }
  button:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:5px 5px 0 rgba(35,26,21,.35)}
  button:active:not(:disabled){transform:translate(4px,4px);box-shadow:0 0 0 rgba(0,0,0,0)}
  button:disabled{opacity:.45;cursor:not-allowed;box-shadow:2px 2px 0 rgba(35,26,21,.2)}
  button.primary{background:var(--gold)}
  button.round{width:36px;height:36px;padding:0;font-size:20px;line-height:1;border-radius:50%}
  select{
    font-family:inherit;font-weight:700;font-size:14px;
    border:2px solid var(--ink);border-radius:8px;padding:4px 6px;background:#fff;color:var(--ink)
  }
  #seatCount{font-size:18px;font-weight:800;min-width:22px;text-align:center}

  /* ---------- table ---------- */
  .stage-wrap{overflow-x:auto;padding-bottom:8px}
  .stage{position:relative;width:1060px;height:660px;margin:0 auto}
  .felt{
    position:absolute;left:190px;top:140px;width:680px;height:380px;
    background:radial-gradient(ellipse at 50% 35%, var(--felt) 0%, var(--felt-dark) 100%);
    border:14px solid var(--rail);border-radius:50%;
    box-shadow:0 0 0 5px var(--rail-dark), 10px 12px 0 rgba(35,26,21,.3),
               inset 0 0 40px rgba(0,0,0,.28);
  }
  .felt::after{
    content:"";position:absolute;inset:18px;border-radius:50%;
    border:3px dashed rgba(255,255,255,.28);
  }
  .board{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    display:flex;gap:10px;align-items:center;z-index:2
  }
  .board-label{
    position:absolute;left:50%;top:calc(50% - 96px);transform:translateX(-50%);
    color:rgba(255,255,255,.85);font-size:13px;font-weight:800;
    letter-spacing:3px;text-transform:uppercase;z-index:2;
    text-shadow:1px 1px 0 rgba(0,0,0,.35)
  }
  .street{
    position:absolute;left:50%;top:calc(50% + 82px);transform:translateX(-50%);
    color:rgba(255,255,255,.9);font-size:14px;font-weight:800;z-index:2;
    background:rgba(0,0,0,.22);border-radius:20px;padding:3px 14px;white-space:nowrap
  }
  .street.warn{background:var(--red);color:#fff}

  /* ---------- cards ---------- */
  .card{
    width:56px;height:78px;border-radius:9px;border:3px solid var(--ink);
    background:#fff;box-shadow:3px 3px 0 rgba(35,26,21,.4);
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    cursor:pointer;position:relative;flex:none;
    transition:transform .08s ease;
  }
  .card:hover{transform:translateY(-4px) rotate(-2deg)}
  .card .rank{font-size:22px;font-weight:800;line-height:1}
  .card .suit{font-size:24px;line-height:1;margin-top:-2px}
  .card.red{color:var(--red)}
  .card.black{color:var(--ink)}
  .card.empty{
    background:rgba(255,255,255,.16);border-style:dashed;
    border-color:rgba(255,255,255,.65);box-shadow:none;
  }
  .card.empty::before{content:"+";font-size:26px;color:rgba(255,255,255,.7);font-weight:800}
  .seat .card.empty{background:rgba(255,255,255,.5);border-color:rgba(35,26,21,.4)}
  .seat .card.empty::before{color:rgba(35,26,21,.45)}
  /* A placed card is a delete target: red on hover with an x badge. Empty
     slots keep the neutral "+" affordance and open the picker instead. */
  .card.removable:hover{
    background:#ffe4e4;border-color:var(--red);
    transform:translateY(-4px) rotate(-2deg);
  }
  .card.removable:hover .rank,
  .card.removable:hover .suit{color:var(--red)}
  .card.removable:hover::after{
    content:"×";
    position:absolute;top:-9px;right:-9px;
    width:21px;height:21px;border-radius:50%;
    background:var(--red);color:#fff;border:2px solid var(--ink);
    font-size:14px;font-weight:800;line-height:17px;text-align:center;
    box-shadow:2px 2px 0 rgba(35,26,21,.35);
  }
  .card.small{width:42px;height:58px}
  .card.small .rank{font-size:16px}
  .card.small .suit{font-size:17px}

  /* ---------- seats ---------- */
  .seat{
    position:absolute;transform:translate(-50%,-50%);
    width:164px;background:var(--cream);
    border:3px solid var(--ink);border-radius:16px;
    padding:8px;box-shadow:var(--shadow);text-align:center;
  }
  .seat.winner{background:var(--gold);border-width:4px}
  .seat .name{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;opacity:.75}
  .seat .cards{display:flex;gap:6px;justify-content:center;margin:6px 0 7px}
  .seat .pct{font-size:21px;font-weight:800;line-height:1.1}
  .seat .pct.idle{opacity:.3}
  .seat .detail{font-size:11px;font-weight:700;opacity:.72;margin-top:2px;
                letter-spacing:.2px;white-space:nowrap}
  .seat .detail .chop{color:#1e7a4e}
  .seat.winner .detail{opacity:.85}
  .bar{height:9px;background:rgba(35,26,21,.15);border-radius:6px;
       overflow:hidden;margin-top:5px;border:2px solid var(--ink)}
  .bar span{display:block;height:100%;width:0;background:var(--felt);
            transition:width .45s cubic-bezier(.2,.8,.3,1)}
  .seat.winner .bar span{background:var(--red)}

  /* ---------- status / picker ---------- */
  .status{
    max-width:1060px;margin:14px auto 0;text-align:center;font-size:15px;
    min-height:26px;
  }
  .status .badge{
    display:inline-block;background:var(--cream);border:3px solid var(--ink);
    border-radius:20px;padding:4px 16px;box-shadow:var(--shadow);font-weight:800
  }
  .status .badge.error{background:#ffd9d9;border-color:var(--red);color:#8c1d1d}

  .overlay{
    position:fixed;inset:0;background:rgba(35,26,21,.55);
    display:none;align-items:center;justify-content:center;padding:20px;z-index:50
  }
  .overlay.open{display:flex}
  .picker{
    background:var(--cream);border:5px solid var(--ink);border-radius:22px;
    box-shadow:8px 8px 0 rgba(35,26,21,.45);padding:18px;max-width:780px;width:100%
  }
  .picker h2{font-size:20px;font-weight:800;margin-bottom:2px;text-align:center}
  .picker-hint{font-size:12px;font-weight:600;opacity:.6;text-align:center;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(13,1fr);gap:5px}
  .grid .card{width:100%;height:60px}
  .grid .card .rank{font-size:17px}
  .grid .card .suit{font-size:18px}
  .grid .card.used{opacity:.2;pointer-events:none;filter:grayscale(1)}
  .picker-actions{display:flex;gap:10px;justify-content:center;margin-top:14px}
</style>
</head>
<body>

<header>
  <h1>&#9824; Poker Equity Table &#9829;</h1>
  <div class="sub">Exact from the flop on &middot; Monte&nbsp;Carlo preflop</div>
</header>

<div class="toolbar">
  <div class="group">
    <label>Players</label>
    <button class="round" id="removePlayer">&minus;</button>
    <span id="seatCount">2</span>
    <button class="round" id="addPlayer">+</button>
  </div>
  <div class="group">
    <label>Preflop trials</label>
    <select id="trials">
      <option value="10000">10k &middot; fast</option>
      <option value="25000" selected>25k &middot; balanced</option>
      <option value="100000">100k &middot; precise</option>
    </select>
  </div>
  <button id="clear">Clear table</button>
  <button class="primary" id="calc">Calculate</button>
</div>

<div class="stage-wrap">
  <div class="stage" id="stage">
    <div class="felt">
      <div class="board-label">Board</div>
      <div class="board" id="board"></div>
      <div class="street" id="street">Preflop</div>
    </div>
  </div>
</div>

<div class="status" id="status"></div>

<div class="overlay" id="overlay">
  <div class="picker">
    <h2 id="pickerTitle">Pick a card</h2>
    <p class="picker-hint">Click a card on the table to remove it</p>
    <div class="grid" id="grid"></div>
    <div class="picker-actions">
      <button id="pickerCancel">Cancel</button>
    </div>
  </div>
</div>

<script>
const RANKS = "23456789TJQKA";
const SUITS = "cdhs";
const SUIT_GLYPH = {c: "♣", d: "♦", h: "♥", s: "♠"};
const RANK_LABEL = {T: "10"};

const rankOf = c => Math.floor(c / 4);
const suitOf = c => c % 4;

let players = [[null, null], [null, null]];
let board = [null, null, null, null, null];
let target = null;      // {kind:'seat'|'board', seat, slot}
let results = null;     // array of equities, or null when nothing is solved

/* ---------- rendering ---------- */

function cardEl(card, opts) {
  opts = opts || {};
  const el = document.createElement("div");
  el.className = "card" + (opts.small ? " small" : "")
                        + (opts.removable ? " removable" : "");
  if (card === null || card === undefined) {
    el.classList.add("empty");
  } else {
    const s = SUITS[suitOf(card)];
    el.classList.add(s === "h" || s === "d" ? "red" : "black");
    const r = RANKS[rankOf(card)];
    const rank = document.createElement("div");
    rank.className = "rank";
    rank.textContent = RANK_LABEL[r] || r;
    const suit = document.createElement("div");
    suit.className = "suit";
    suit.textContent = SUIT_GLYPH[s];
    el.appendChild(rank);
    el.appendChild(suit);
  }
  if (opts.onClick) el.addEventListener("click", opts.onClick);
  return el;
}

function seatPosition(i, total) {
  // Seats ride an ellipse just outside the felt; seat 1 sits at the bottom.
  const cx = 530, cy = 330, rx = 430, ry = 250;
  const angle = Math.PI / 2 + (i * 2 * Math.PI) / total;
  return {x: cx + rx * Math.cos(angle), y: cy + ry * Math.sin(angle)};
}

function render() {
  const boardEl = document.getElementById("board");
  boardEl.innerHTML = "";
  board.forEach(function (c, slot) {
    const spot = {kind: "board", slot: slot};
    boardEl.appendChild(cardEl(c, {
      removable: c !== null,
      onClick: () => (c === null ? openPicker(spot) : removeCard(spot))
    }));
  });

  document.querySelectorAll(".seat").forEach(el => el.remove());
  const stage = document.getElementById("stage");
  const best = results ? Math.max.apply(null, results.map(r => r.equity)) : null;

  players.forEach(function (hand, i) {
    const pos = seatPosition(i, players.length);
    const seat = document.createElement("div");
    seat.className = "seat";
    if (results && results[i].equity === best && best > 0) seat.classList.add("winner");
    seat.style.left = pos.x + "px";
    seat.style.top = pos.y + "px";

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = "Player " + (i + 1);
    seat.appendChild(name);

    const cards = document.createElement("div");
    cards.className = "cards";
    hand.forEach(function (c, slot) {
      const spot = {kind: "seat", seat: i, slot: slot};
      cards.appendChild(cardEl(c, {
        small: true,
        removable: c !== null,
        onClick: () => (c === null ? openPicker(spot) : removeCard(spot))
      }));
    });
    seat.appendChild(cards);

    const pct = document.createElement("div");
    pct.className = "pct" + (results ? "" : " idle");
    pct.textContent = results ? (results[i].equity * 100).toFixed(1) + "%" : "--";
    seat.appendChild(pct);

    // Equity folds wins and chops together; showing both keeps a hand that
    // scoops apart from one that only ever splits.
    const detail = document.createElement("div");
    detail.className = "detail";
    if (results) {
      const r = results[i];
      detail.innerHTML = "Win " + (r.win * 100).toFixed(1) + "%"
        + ' &middot; <span class="chop">Chop ' + (r.chop * 100).toFixed(1) + "%</span>";
    } else {
      detail.innerHTML = "&nbsp;";
    }
    seat.appendChild(detail);

    const bar = document.createElement("div");
    bar.className = "bar";
    const fill = document.createElement("span");
    bar.appendChild(fill);
    seat.appendChild(bar);

    stage.appendChild(seat);
    requestAnimationFrame(function () {
      fill.style.width = results ? (results[i].equity * 100) + "%" : "0%";
    });
  });

  document.getElementById("seatCount").textContent = players.length;
  document.getElementById("addPlayer").disabled = players.length >= 9;
  document.getElementById("removePlayer").disabled = players.length <= 2;
  const streetEl = document.getElementById("street");
  streetEl.textContent = streetName();
  streetEl.classList.toggle("warn", !boardContiguous());
  document.getElementById("calc").disabled = !dealReady();
}

function boardCards() {
  return board.filter(c => c !== null);
}

// Any change to the deal makes the last solve stale - drop the numbers and the
// badge together so the page never shows a result for a deal that has moved on.
function invalidate() {
  results = null;
  setStatus("");
}

// The board is dealt left to right, so every filled slot must come before every
// empty one. A hole in the middle is not a board any street could produce.
function boardContiguous() {
  const firstGap = board.indexOf(null);
  return firstGap === -1 || board.slice(firstGap).every(c => c === null);
}

function streetName() {
  if (!boardContiguous()) return "Fill the gap in the board";
  const n = boardCards().length;
  if (n === 0) return "Preflop";
  // 1 or 2 cards is not a street, so Calculate stays disabled - say why rather
  // than leaving an empty pill sitting on the felt.
  if (n < 3) return "Flop needs " + (3 - n) + " more";
  return ["", "", "", "Flop", "Turn", "River"][n];
}

function dealReady() {
  const handsFull = players.every(h => h[0] !== null && h[1] !== null);
  return handsFull && boardContiguous()
    && [0, 3, 4, 5].indexOf(boardCards().length) !== -1;
}

/* ---------- card picker ---------- */

function usedCards() {
  const used = new Set();
  players.forEach(h => h.forEach(c => { if (c !== null) used.add(c); }));
  board.forEach(c => { if (c !== null) used.add(c); });
  return used;
}

function openPicker(t) {
  target = t;
  const used = usedCards();
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  // One row per suit, ranks ascending across - reads like a spread deck.
  for (const s of SUITS) {
    for (const r of RANKS) {
      const card = RANKS.indexOf(r) * 4 + SUITS.indexOf(s);
      const el = cardEl(card, {onClick: () => assign(card)});
      if (used.has(card)) el.classList.add("used");
      grid.appendChild(el);
    }
  }
  document.getElementById("pickerTitle").textContent =
    target.kind === "board"
      ? "Board card " + (target.slot + 1)
      : "Player " + (target.seat + 1) + " — card " + (target.slot + 1);
  document.getElementById("overlay").classList.add("open");
}

function closePicker() {
  target = null;
  document.getElementById("overlay").classList.remove("open");
}

function assign(card) {
  if (target.kind === "board") board[target.slot] = card;
  else players[target.seat][target.slot] = card;
  invalidate();
  closePicker();
  render();
}

function removeCard(spot) {
  // Cards stay put: pulling one leaves its slot empty rather than sliding the
  // rest across. A gap makes the board illegal, which dealReady() catches.
  if (spot.kind === "board") board[spot.slot] = null;
  else players[spot.seat][spot.slot] = null;
  invalidate();
  render();
}

/* ---------- solving ---------- */

function setStatus(text, isError) {
  const el = document.getElementById("status");
  if (!text) { el.innerHTML = ""; return; }
  const badge = document.createElement("span");
  badge.className = "badge" + (isError ? " error" : "");
  badge.textContent = text;
  el.innerHTML = "";
  el.appendChild(badge);
}

async function calculate() {
  document.getElementById("calc").disabled = true;
  setStatus("Dealing it out…");
  try {
    const res = await fetch("/api/equity", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        hands: players,
        board: boardCards(),
        trials: Number(document.getElementById("trials").value)
      })
    });
    const data = await res.json();
    if (!res.ok) {
      results = null;
      setStatus(data.error || "Something went wrong", true);
    } else {
      results = data.results;
      if (data.exact) {
        setStatus("Exact — every remaining runout enumerated");
      } else {
        // Worst per-hand standard error, so ± covers every seat shown.
        const err = Math.max.apply(null, results.map(r => r.stderr)) * 100;
        setStatus("Estimated from " + data.trials.toLocaleString()
          + " random runouts ±" + err.toFixed(2) + " pts");
      }
    }
  } catch (err) {
    results = null;
    setStatus("Could not reach the server — is server.py running?", true);
  }
  render();
}

/* ---------- wiring ---------- */

document.getElementById("addPlayer").onclick = function () {
  if (players.length < 9) { players.push([null, null]); invalidate(); render(); }
};
document.getElementById("removePlayer").onclick = function () {
  if (players.length > 2) { players.pop(); invalidate(); render(); }
};
document.getElementById("clear").onclick = function () {
  players = players.map(() => [null, null]);
  board = [null, null, null, null, null];
  results = null;
  setStatus("");
  render();
};
document.getElementById("calc").onclick = calculate;
document.getElementById("pickerCancel").onclick = closePicker;
document.getElementById("overlay").onclick = function (e) {
  if (e.target.id === "overlay") closePicker();
};
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") closePicker();
});

render();
</script>
</body>
</html>
